$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "mahasiswa@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.token) pm.collectionVariables.set('token', j.token);
    language: text/javascript
order: 5000
